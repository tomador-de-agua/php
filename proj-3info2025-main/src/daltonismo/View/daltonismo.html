  <div class="background-video" aria-hidden="true">

  <main style="padding:80px 20px; min-height:100vh;">
    <div style="max-width:1100px; margin:0 auto; background: rgba(10,10,10,0.55); padding:24px; border-radius:12px;">
      <h1>Nome do módulo</h1>
      <p>Descrição curta do que esse módulo faz. Este arquivo serve como template para as equipes implementarem suas páginas.</p>

      </section>
    </div>
  </main>

  <script src="app.js"></script>
  <h2>Dynamic Table with Multiple Selects</h2>
  <table id="myTable">
      <thead>
          <tr>
              <th>Coluna 1</th>
              <th>Ações</th>
          </tr>
      </thead>
      <tbody>
          <tr>
              <td>
                  <div class="select-container">
                      <select>
                          <option value="option1">Option 1</option>
                          <option value="option2">Option 2</option>
                          <option value="option3">Option 3</option>
                      </select>
                      <button onclick="addSelect(this)">Add Select</button>
                  </div>
              </td>
              <td><button onclick="removeRow(this)">Remove</button></td>
          </tr>
      </tbody>
  </table>
  <button onclick="addRow()">Add Row</button>
  <script>
  function addRow() {
      const table = document.getElementById("myTable").getElementsByTagName('tbody')[0];
      const newRow = table.insertRow();
      const cell1 = newRow.insertCell(0);
      const cell2 = newRow.insertCell(1);
      cell1.innerHTML = `
          <div class="select-container">
              <select>
                  <option value="option1">Option 1</option>
                  <option value="option2">Option 2</option>
                  <option value="option3">Option 3</option>
              </select>
              <button onclick="addSelect(this)">Add Select</button>
          </div>
      `;
      cell2.innerHTML = `<button onclick="removeRow(this)">Remove</button>`;
  }
  function addSelect(button) {
      const container = button.parentNode;
      const newSelect = document.createElement("select");
      newSelect.innerHTML = `
          <option value="option1">Option 1</option>
          <option value="option2">Option 2</option>
          <option value="option3">Option 3</option>
      `;
      container.insertBefore(newSelect, button);
  }
  function removeRow(button) {
      const row = button.parentNode.parentNode;
      row.parentNode.removeChild(row);
  }
  </script>
</body>
</html>
